[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysearchnlp"
version = "1.0.0"
description = "A custom Natural Language Search Engine & NLP Processing Pipeline built from scratch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Iago", email = "iago@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
    "flask>=3.0.0",
    "lxml>=5.0.0",
    "nltk>=3.8.1",
    "spacy>=3.7.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
